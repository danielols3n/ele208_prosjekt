# Kontrolleren tar imot leddbanen fra MATLAB.
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_trajectory_controller:
  ros__parameters:
    joints:
    - boom_yaw
    - boom_pitch
    - boom_extension
    - arm_swivel
    - arm_joint_1
    - arm_joint_2
    - arm_joint_3
    - arm_joint_4
    - arm_joint_5
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.03
      boom_extension:
        goal: 0.025
